<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Live</title>
    <meta name="description" content="Live football scores, fixtures, standings, and match details adapted for My PC and Smart TV.">
    <meta property="og:title" content="Football Live">
    <meta property="og:description" content="Live football scores, fixtures, standings, and match details adapted for My PC and Smart TV.">

    <!-- My PC SDK: MUST be the first script of the page -->
    <script src="https://imad-os.github.io/g/sdk/mypc-sdk.js"></script>

    <!-- Firebase SDKs for seamless Football App backend sync -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- Broadcast Typography: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css?v=1.0.6">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

<div id="app-wrapper">

    <svg xmlns="http://www.w3.org/2000/svg" style="display:none;">
        <defs>
          <symbol id="icon-star" viewBox="0 0 24 24">
            <polygon points="12,2 15,9 22,9 17,14 19,22 12,18 5,22 7,14 2,9 9,9"/>
          </symbol>
          <symbol id="icon-hourglass" viewBox="0 0 24 24">
            <g class="hourglass-body">
                <path d="M5 2h14" stroke="currentColor" stroke-width="2" />
                <path d="M5 22h14" stroke="currentColor" stroke-width="2" />
                <path d="M6 2v6a6 6 0 0 0 6 6 6 6 0 0 0 6-6V2" stroke="currentColor" stroke-width="2" fill="none"/>
                <path d="M6 22v-6a6 6 0 0 1 6-6 6 6 0 0 1 6 6v6" stroke="currentColor" stroke-width="2" fill="none"/>
            </g>
          </symbol>
        </defs>
    </svg>

    <!-- LEFT SIDEBAR -->
    <nav id="sidebar" aria-label="Main Navigation">
        <div class="sidebar-logo">
            <img src="assets/icon.png" alt="Football Live">
        </div>
        <div class="sidebar-menu">
            <button type="button" class="menu-item focusable active" data-target="home" id="nav-home" tabindex="0" aria-label="Matches">
                <i class="ph ph-soccer-ball"></i>
                <span>Matches</span>
            </button>
            <button type="button" class="menu-item focusable" data-target="calendar" id="nav-calendar" tabindex="0" aria-label="Calendar">
                <i class="ph ph-calendar"></i>
                <span>Calendar</span>
            </button>
            <button type="button" class="menu-item focusable" data-target="auth" id="nav-auth" tabindex="0" aria-label="Favorites">
                <i class="ph ph-star"></i>
                <span>Favorites</span>
            </button>
            <button type="button" class="menu-item focusable" data-target="settings" id="nav-settings" tabindex="0" aria-label="Settings">
                <i class="ph ph-gear"></i>
                <span>Settings</span>
            </button>
        </div>
        <div class="sidebar-footer">
             <div class="time-display" id="clock">--:--</div>
             <div class="progress" id="refreshTimer">
                <div class="progress-fill" style="width:100%"></div>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT AREA -->
    <main id="main-view">

        <!-- Broadcast Top Date & Filter Bar (TV Remote & Controller Accessible) -->
        <header id="date-header-wrapper">
            <div class="date-header-left">
                <div id="date-header">Today</div>
            </div>
            <div class="date-header-controls">
                <button type="button" id="header-btn-prev" class="date-nav-btn focusable" tabindex="0" aria-label="Previous Day">
                    <i class="ph ph-caret-left"></i> Prev Day
                </button>
                <button type="button" id="header-btn-today" class="date-nav-btn focusable" tabindex="0" aria-label="Today">
                    Today
                </button>
                <button type="button" id="header-btn-next" class="date-nav-btn focusable" tabindex="0" aria-label="Next Day">
                    Next Day <i class="ph ph-caret-right"></i>
                </button>
                <button type="button" id="header-btn-live" class="date-nav-btn live-filter-btn focusable" tabindex="0" aria-label="Live Only">
                    Live Only
                </button>
            </div>
        </header>

        <!-- SCROLLABLE ROWS CONTAINER -->
        <div id="content-container">
            <!-- Content dynamically injected -->
        </div>

    </main>

    <!-- MODALS CONTAINER -->
    <div id="modal-overlay" class="modal-overlay">

        <!-- Date Modal -->
        <div id="date-modal" class="modal-content" style="display:none;">
            <h2>Select Match Date</h2>
            <div class="date-controls">
                <button type="button" id="btn-prev-day" class="icon-button focusable" tabindex="0" aria-label="Previous Day"><i class="ph ph-caret-left"></i></button>
                <span id="modal-current-date" class="modal-date-label">Today</span>
                <button type="button" id="btn-next-day" class="icon-button focusable" tabindex="0" aria-label="Next Day"><i class="ph ph-caret-right"></i></button>
            </div>
            <div style="margin-top: 1.5rem;">
                <button type="button" id="btn-live-toggle" class="styled-button focusable" tabindex="0">Toggle Live Matches Only</button>
            </div>
            <button type="button" class="modal-close styled-button secondary focusable" style="margin-top:1rem;" tabindex="0">Close</button>
        </div>

    </div>

    <!-- LIVE EVENT ALERT -->
    <div id="live-alert" class="alert-toast focusable" tabindex="0" style="display:none;"></div>

    <!-- TOAST CONTAINER -->
    <div id="toast-container" class="toast-container"></div>

    <!-- GAMEPAD / REMOTE HUD HINTS -->
    <div class="gamepad-hud" id="gamepad-hud">
        <div class="hud-hint"><span class="hud-btn">OK / B</span> Select</div>
        <div class="hud-hint"><span class="hud-btn">Back / A</span> Back</div>
        <div class="hud-hint" id="hud-track-hint"><span class="hud-btn">X</span> Track Alert</div>
        <div class="hud-hint" id="hud-fav-hint"><span class="hud-btn">Y / ★</span> Fav Team</div>
        <div class="hud-hint"><span class="hud-btn">LB / RB</span> Day</div>
    </div>

</div>

<audio id="snd-goal" src="assets/sounds/goal.mp3" preload="auto"></audio>
<audio id="snd-whistle" src="assets/sounds/whistle.mp3" preload="auto"></audio>

<script src="js/service_football.js?v=1.0.6"></script>
<script src="js/services.js?v=1.0.6"></script>
<script src="js/navigation.js?v=1.0.6"></script>
<script src="js/utils.js?v=1.0.6"></script>
<script src="js/ui.js?v=1.0.6"></script>
<script src="js/router.js?v=1.0.6"></script>
<script src="js/main.js?v=1.0.6"></script>

</body>
</html>
